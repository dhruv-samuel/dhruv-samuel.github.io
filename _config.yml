title: "Dhruv Samuel"
tagline: "VFX Artist • 3D Generalist"
description: >-
  Portfolio of 3D art, environment/character work, and motion — modeling,
  texturing, lighting, and rendering across film, games, and personal projects.
email: your.email@example.com
url: "" # e.g. https://yourusername.github.io
baseurl: "" # e.g. /portfolio if hosted at username.github.io/portfolio

# One-line theme swap: "dark" or "light"
color_scheme: dark

# Social links shown in header/footer — leave blank to hide
social:
  artstation: ""
  linkedin: ""
  instagram: ""
  github: ""
  vimeo: ""

resume_url: "" # link to a hosted PDF resume, or leave blank

collections:
  projects:
    output: true
    permalink: /work/:path/

defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
    values:
      layout: "default"

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
