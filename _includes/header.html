<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/img/logo.svg' | relative_url }}" alt="{{ site.title }}" class="brand-logo">
    </a>
    <nav class="site-nav">
      <a href="{{ '/work/' | relative_url }}" {% if page.url contains '/work' %}class="active"{% endif %}>Work</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}class="active"{% endif %}>About</a>
      <a href="{{ '/contact/' | relative_url }}" {% if page.url == '/contact/' %}class="active"{% endif %}>Contact</a>
    </nav>
  </div>
</header>
